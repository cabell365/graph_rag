services:
  neo4j:
    image: neo4j:5.26-community
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 3G
      NEO4J_server_memory_pagecache_size: 1G
    volumes: ["neo4j_data:/data", "neo4j_logs:/logs"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
  ollama:
    image: ollama/ollama:latest
    ports: ["127.0.0.1:11434:11434"]
    volumes: ["ollama_data:/root/.ollama"]
  app:
    build: .
    ports: ["127.0.0.1:8981:8981"]
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      OLLAMA_URL: http://ollama:11434
    volumes: ["./data:/app/data", "./reports:/app/reports"]
    depends_on:
      neo4j: {condition: service_healthy}
      ollama: {condition: service_started}
volumes:
  neo4j_data:
  neo4j_logs:
  ollama_data:
